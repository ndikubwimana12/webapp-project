<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - WebApp Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center">

    <main class="bg-white p-10 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-3xl font-bold text-center mb-8">Register</h1>

        <form id="registerForm" class="space-y-5">
            <input name="username" placeholder="Username" required
                class="w-full border p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">

            <input name="password" type="password" placeholder="Password" minlength="8" required
                class="w-full border p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">

            <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700">
                Register
            </button>
        </form>

        <p id="message" class="text-center mt-5 text-sm"></p>

        <p class="text-center mt-5 text-slate-600">
            Already have an account?
            <a href="/login.html" class="text-blue-600">Login</a>
        </p>
    </main>

    <script>
        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const message = document.getElementById("message");
            const button = e.target.querySelector("button");

            const data = Object.fromEntries(new FormData(e.target));

            button.disabled = true;
            button.textContent = "Registering...";

            try {
                const response = await fetch("/api/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                message.textContent = result.message || "Registration failed.";
                message.className = response.ok
                    ? "text-center mt-5 text-sm text-green-600"
                    : "text-center mt-5 text-sm text-red-600";

                if (response.ok) {
                    setTimeout(() => {
                        window.location.href = "/dashboard.html";
                    }, 1000);
                } else {
                    button.disabled = false;
                    button.textContent = "Register";
                }

            } catch (error) {
                message.textContent = "Unable to connect to the server.";
                message.className = "text-center mt-5 text-sm text-red-600";

                button.disabled = false;
                button.textContent = "Register";
            }
        });
    </script>
</body>

</html>
