<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WebApp Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center">

    <main class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-3xl font-bold text-center mb-6">Login</h1>

        <form id="loginForm" class="space-y-4">
            <input name="username" placeholder="Username" required class="w-full border p-3 rounded-lg">

            <input name="password" type="password" placeholder="Password" required class="w-full border p-3 rounded-lg">

            <button class="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700">
                Login
            </button>
        </form>

        <p id="message" class="text-center mt-4 text-sm"></p>

        <p class="text-center mt-4">
            Don't have an account?
            <a href="/register.html" class="text-blue-600">Register</a>
        </p>
    </main>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const data = Object.fromEntries(new FormData(event.target));

            const response = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            document.getElementById("message").textContent = result.message;

            if (response.ok) {
                window.location.href = "/dashboard.html";
            }
        });
    </script>

</body>

</html>
